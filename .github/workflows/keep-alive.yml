name: Supabase Keep Alive

on:
  schedule:
    # Every 14 minutes from 9am to 9pm EST (14:00 to 02:00 UTC)
    - cron: "0,14,28,42 14-23 * * *"
    - cron: "0,14,28,42 0,1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  API_DOMAIN: ${{ secrets.API_DOMAIN }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -fsS "https://${API_DOMAIN}/healthz"
